# Lexicon configuration
# Copy to $XDG_CONFIG_HOME/lexicon/config.toml (usually ~/.config/lexicon/config.toml).
# Unknown keys and invalid values are reported in the log; invalid values keep their defaults.

[general]
# Accepted but not implemented yet. Stage 3 will manage a per-user autostart entry.
start_on_login = false
offline_first = true

[interaction]
# Stage 1 supports only "global_shortcut".
activation = "global_shortcut"
# Clipboard fallback is reserved for a later release and is currently unused.
clipboard_fallback = false
# Escape works while the popup has focus.
dismiss_on_escape = true
# Clicks inside the popup window (including its margin) dismiss it.
# Clicks elsewhere on the desktop are not detected yet.
dismiss_on_outside_click = true

[hotkeys]
# KGlobalAccel shortcut. SUPER is normalized to Meta.
lookup = "SUPER+SHIFT+D"

[appearance]
# "dark", "light", or "system". System follows the desktop color scheme and falls
# back to dark when the platform does not report one.
theme = "dark"
# Popup width in logical pixels, clamped to 240..1200.
popup_width = 360
# "none" or "subtle".
animation = "subtle"
# "near_selection", "center", or "cursor". Selection coordinates are not available yet,
# so near_selection currently behaves like cursor placement.
position = "near_selection"

[dictionary]
# An explicit single dictionary file. Leave empty to search `directory` for the
# configured language pair instead. Relative paths resolve against this file.
database_path = ""
# Installed dictionaries live here. Empty means $XDG_DATA_HOME/lexicon/dictionaries.
directory = ""
# Source language of the words you look up, target language of the definitions.
# Equal tags mean monolingual definitions; a different target language needs an
# installed translation pack to show a translation.
source_language = "en"
target_language = "en"
show_pronunciation = true
# "respelling" or "ipa". IPA is available for the bundled WordNet dictionary.
pronunciation_style = "respelling"

[translation]
# Static catalog of downloadable Argos Translate language packs. Empty disables
# downloads; nothing is fetched unless you press install in the settings window.
catalog_url = ""

[performance]
cache_enabled = true
lazy_initialize = true
