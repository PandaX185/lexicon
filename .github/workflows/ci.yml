name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  core:
    name: Core checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: popup/frontend/package-lock.json

      - name: Install just
        run: |
          version=1.59.0
          curl -fsSL "https://github.com/casey/just/releases/download/${version}/just-${version}-x86_64-unknown-linux-musl.tar.gz" \
            | sudo tar -xz -C /usr/local/bin just
          just --version

      # The popup build is covered by the matrix job below; core needs no WebKit.
      - name: Check formatting
        run: just fmt-check
      - name: Check bootstrap script
        run: sh -n install.sh && bash -n install.sh
      - name: Vet
        run: go vet ./...
      - name: Lint core
        run: just lint-core
      - name: Typecheck frontend
        run: just lint-frontend
      - name: Test with race detector
        run: go test -race ./...
      - name: Build core binaries
        run: just core

  popup:
    name: Popup (${{ matrix.name }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: gtk4-webkit6
            packages: >-
              libgtk-4-dev libwebkitgtk-6.0-dev libglib2.0-dev
              pkg-config xvfb
            tags: ""
          - name: gtk3-webkit41
            packages: >-
              libgtk-3-dev libwebkit2gtk-4.1-dev libglib2.0-dev
              pkg-config xvfb
            tags: gtk3
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: popup/frontend/package-lock.json

      - name: Install just
        run: |
          version=1.59.0
          curl -fsSL "https://github.com/casey/just/releases/download/${version}/just-${version}-x86_64-unknown-linux-musl.tar.gz" \
            | sudo tar -xz -C /usr/local/bin just
          just --version

      - name: Install GTK/WebKit development packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ${{ matrix.packages }}

      - name: Install frontend dependencies
        run: just popup-deps

      # Leaving POPUP_GO_TAGS unset on the GTK4 entry exercises auto-detection.
      - name: Test popup
        run: |
          if [[ -n "${{ matrix.tags }}" ]]; then
            export POPUP_GO_TAGS="${{ matrix.tags }}"
          fi
          xvfb-run -a just test-popup

      - name: Build popup
        run: |
          if [[ -n "${{ matrix.tags }}" ]]; then
            export POPUP_GO_TAGS="${{ matrix.tags }}"
          fi
          xvfb-run -a just build-popup

      - name: Verify popup binary
        run: test -x bin/lexicon-popup
