# Lexicon injects its configuration through runtime context properties
# (QQmlContext::setContextProperty("config", ...) in Application.cpp). qmllint and
# qmlls cannot see those values, so every use is reported as "Unqualified access".
# The long-term fix is to register the configuration as a QML type; until then the
# warning is suppressed project-wide.
[Warnings]
UnqualifiedAccess=disable
